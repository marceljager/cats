# every push to main: build the site and publish dist/ on GitHub Pages
# (https://marceljager.github.io/cats/). Settings → Pages → Source must be "GitHub Actions".
# The public address (the CDN domain) goes in Settings → Secrets and variables → Actions →
# Variables as SITE_URL; without it the build has no og:image, canonical or ai-catalog.json.
# Secrets CDN_PURGE_URL (purge-all API address, resource ID included) and CDN_API_TOKEN, in the
# "production" environment, make every deploy end by clearing the CDN's cache; they stay out of
# the repo and are masked in the logs.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # encoded photos from earlier runs: only new or changed ones get encoded again
      - uses: actions/cache@v4
        with:
          path: |
            public/photos
            src/photos.json
          key: photos-${{ hashFiles('photos/**', 'scripts/images.js') }}
          restore-keys: photos-
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # the CDN in front fetches the new files from Pages instead of serving its cached copy. Its own job
  # in the "production" environment, which holds the secrets; skipped until both exist. The short wait
  # lets Pages' own cache switch to the new deploy first.
  purge:
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    env:
      PURGE_URL: ${{ secrets.CDN_PURGE_URL }}
      API_TOKEN: ${{ secrets.CDN_API_TOKEN }}
    steps:
      - name: Purge CDN cache
        if: env.PURGE_URL != '' && env.API_TOKEN != ''
        run: |
          sleep 30
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            -X POST "$PURGE_URL" \
            -H "Authorization: Bearer $API_TOKEN" \
            -H "Content-Type: application/json" \
            -o /dev/null -w "purge: HTTP %{http_code}\n"
