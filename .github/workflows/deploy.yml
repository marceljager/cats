# every push to main: build the site and publish dist/ on GitHub Pages
# (https://marceljager.github.io/cats/). Settings → Pages → Source must be "GitHub Actions".
# The public address (the CDN domain) goes in Settings → Secrets and variables → Actions →
# Variables as SITE_URL; without it the build has no og:image, canonical or ai-catalog.json.
# Secrets CDN_PURGE_URL (purge-all API address, resource ID included) and CDN_API_TOKEN, in the
# "production" environment, make every deploy end by clearing the CDN's cache; they stay out of
# the repo and are masked in the logs.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # encoded photos from earlier runs: only new or changed ones get encoded again
      - uses: actions/cache@v4
        with:
          path: |
            public/photos
            src/photos.json
          key: photos-${{ hashFiles('photos/**', 'scripts/encode-photos.js') }}
          restore-keys: photos-
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      # nothing is published unless the types check and the tests pass (content.js, the map's
      # geometry, sharing, and every photo file the page asks for)
      - run: npm run check
      - run: npm test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # the CDN in front fetches the new files from Pages instead of its cached copy. The secrets live in
  # the "production" environment; the wait lets Pages' own cache switch over first. The response is
  # never printed (it names the resource, and the log is public): a failure shows only its HTTP code.
  purge:
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Purge CDN cache
        env:
          PURGE_URL: ${{ secrets.CDN_PURGE_URL }}
          API_TOKEN: ${{ secrets.CDN_API_TOKEN }}
        run: |
          sleep 30
          curl --fail --silent --show-error --retry 3 -o /dev/null -X POST "$PURGE_URL" -H "Authorization: Bearer $API_TOKEN"
